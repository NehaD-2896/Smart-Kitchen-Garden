<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Kitchen Garden Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --green: #2e7d32;
    --green-light: #e8f5e9;
    --amber: #f9a825;
    --red: #c62828;
    --bg: #f4f6f5;
    --card-bg: #ffffff;
    --text: #1c1c1c;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--bg);
    margin: 0;
    padding: 24px;
    color: var(--text);
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }
  h1 {
    color: var(--green);
    margin-bottom: 4px;
  }
  .subtitle {
    color: #666;
    margin-top: 0;
    margin-bottom: 24px;
  }
  .nav a {
    color: var(--green);
    text-decoration: none;
    margin-left: 16px;
    font-size: 0.9em;
    font-weight: 600;
  }
  .nav a:hover { text-decoration: underline; }
  .nav span { color: #666; font-size: 0.9em; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
  }
  .card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .card h2 {
    margin: 0 0 12px 0;
    font-size: 1.1em;
    color: var(--green);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .status-dot {
    width: 10px; height: 10px; border-radius: 50%;
    display: inline-block; margin-right: 6px;
  }
  .dot-ok { background: var(--green); }
  .dot-alert { background: var(--red); }
  .metric-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid #eee;
    font-size: 0.95em;
  }
  .metric-row:last-child { border-bottom: none; }
  .metric-value { font-weight: 600; }
  .warn { color: var(--red); }
  canvas { margin-top: 10px; max-height: 140px; }
  .irrigation-tag {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 0.8em;
    font-weight: 600;
  }
  .irrigation-on { background: #e3f2fd; color: #1565c0; }
  .irrigation-off { background: var(--green-light); color: var(--green); }
  .thresholds-card { grid-column: 1 / -1; }
  .thresh-form {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-top: 10px;
  }
  .thresh-node {
    background: #fafafa;
    border-radius: 8px;
    padding: 10px 12px;
    border: 1px solid #e0e0e0;
  }
  .thresh-node label {
    display: block;
    font-size: 0.8em;
    color: #555;
    margin-top: 6px;
  }
  input[type=number] {
    width: 100%;
    padding: 5px 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
    margin-top: 2px;
  }
  button {
    margin-top: 10px;
    background: var(--green);
    color: white;
    border: none;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85em;
  }
  button:hover { background: #1b5e20; }
  .alerts-card ul { padding-left: 18px; margin: 8px 0 0 0; font-size: 0.85em; }
  .no-data { color: #999; font-style: italic; }
  .timestamp { font-size: 0.75em; color: #999; margin-top: 6px; }
</style>
</head>
<body>

<div class="topbar">
  <h1>🌱 Smart Kitchen Garden Dashboard</h1>
  <div class="nav">
    <span>Logged in as {{ username }}</span>
    <a href="/inbox">📧 Inbox</a>
    <a href="/logout">Logout</a>
  </div>
</div>
<p class="subtitle">LoRa Wireless Sensor Network — Live status across 4 plant pods</p>

<div class="grid" id="nodeGrid"></div>

<div class="card thresholds-card" style="margin-top:20px;">
  <h2>⚙️ Configurable Thresholds</h2>
  <div class="thresh-form" id="threshForm"></div>
</div>

<div class="card alerts-card" style="margin-top:20px;">
  <h2>🔔 Recent Alerts</h2>
  <ul id="alertsList"><li class="no-data">No alerts yet</li></ul>
</div>

<script>
const NODE_IDS = {{ node_ids | tojson }};
const charts = {};

function nodeCardHTML(nodeId) {
  return `
    <div class="card" id="card-${nodeId}">
      <h2><span><span class="status-dot dot-ok" id="dot-${nodeId}"></span>${nodeId.toUpperCase()}</span>
          <span class="irrigation-tag irrigation-off" id="irr-${nodeId}">IDLE</span></h2>
      <div class="metric-row"><span>Soil Moisture</span><span class="metric-value" id="moist-${nodeId}">--</span></div>
      <div class="metric-row"><span>TDS</span><span class="metric-value" id="tds-${nodeId}">--</span></div>
      <div class="metric-row"><span>Temperature</span><span class="metric-value" id="temp-${nodeId}">--</span></div>
      <canvas id="chart-${nodeId}"></canvas>
      <div class="timestamp" id="ts-${nodeId}">No data yet</div>
    </div>
  `;
}

function threshFormHTML(nodeId) {
  return `
    <div class="thresh-node" id="thresh-${nodeId}">
      <strong>${nodeId.toUpperCase()}</strong>
      <label>Min Soil Moisture (%)</label>
      <input type="number" step="0.1" id="mm-${nodeId}">
      <label>Min TDS (ppm)</label>
      <input type="number" step="0.1" id="tmin-${nodeId}">
      <label>Max TDS (ppm)</label>
      <input type="number" step="0.1" id="tmax-${nodeId}">
      <button onclick="saveThresholds('${nodeId}')">Save</button>
    </div>
  `;
}

document.getElementById('nodeGrid').innerHTML = NODE_IDS.map(nodeCardHTML).join('');
document.getElementById('threshForm').innerHTML = NODE_IDS.map(threshFormHTML).join('');

NODE_IDS.forEach(nodeId => {
  const ctx = document.getElementById(`chart-${nodeId}`).getContext('2d');
  charts[nodeId] = new Chart(ctx, {
    type: 'line',
    data: {
      labels: [],
      datasets: [
        { label: 'Moisture %', data: [], borderColor: '#2e7d32', tension: 0.3, pointRadius: 0 },
        { label: 'TDS ppm', data: [], borderColor: '#1565c0', tension: 0.3, pointRadius: 0 },
        { label: 'Temp °C', data: [], borderColor: '#f9a825', tension: 0.3, pointRadius: 0 },
      ]
    },
    options: {
      responsive: true,
      animation: false,
      scales: { y: { beginAtZero: true } },
      plugins: { legend: { labels: { font: { size: 9 } } } }
    }
  });
});

async function refreshLatest() {
  const res = await fetch('/api/latest');
  if (res.status === 401) { window.location.href = '/login'; return; }
  const data = await res.json();
  for (const nodeId of NODE_IDS) {
    const reading = data[nodeId];
    if (!reading) continue;
    document.getElementById(`moist-${nodeId}`).textContent = reading.soil_moisture.toFixed(1) + ' %';
    document.getElementById(`tds-${nodeId}`).textContent = reading.tds.toFixed(1) + ' ppm';
    document.getElementById(`temp-${nodeId}`).textContent = reading.temperature.toFixed(1) + ' °C';
    document.getElementById(`ts-${nodeId}`).textContent = 'Last update: ' + reading.timestamp;

    const irrTag = document.getElementById(`irr-${nodeId}`);
    if (reading.irrigated) {
      irrTag.textContent = 'IRRIGATING';
      irrTag.className = 'irrigation-tag irrigation-on';
    } else {
      irrTag.textContent = 'IDLE';
      irrTag.className = 'irrigation-tag irrigation-off';
    }
  }
}

async function refreshHistory() {
  for (const nodeId of NODE_IDS) {
    const res = await fetch(`/api/history/${nodeId}`);
    if (res.status === 401) { window.location.href = '/login'; return; }
    const rows = await res.json();
    const chart = charts[nodeId];
    chart.data.labels = rows.map(r => r.timestamp.split('T')[1] || r.timestamp);
    chart.data.datasets[0].data = rows.map(r => r.soil_moisture);
    chart.data.datasets[1].data = rows.map(r => r.tds);
    chart.data.datasets[2].data = rows.map(r => r.temperature);
    chart.update();
  }
}

async function loadThresholds() {
  const res = await fetch('/api/thresholds');
  if (res.status === 401) { window.location.href = '/login'; return; }
  const rows = await res.json();
  rows.forEach(t => {
    document.getElementById(`mm-${t.node_id}`).value = t.moisture_min;
    document.getElementById(`tmin-${t.node_id}`).value = t.tds_min;
    document.getElementById(`tmax-${t.node_id}`).value = t.tds_max;
  });
}

async function saveThresholds(nodeId) {
  const body = {
    moisture_min: parseFloat(document.getElementById(`mm-${nodeId}`).value),
    tds_min: parseFloat(document.getElementById(`tmin-${nodeId}`).value),
    tds_max: parseFloat(document.getElementById(`tmax-${nodeId}`).value),
  };
  await fetch(`/api/thresholds/${nodeId}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  alert(`Thresholds updated for ${nodeId}`);
}

async function refreshAlerts() {
  const res = await fetch('/api/alerts');
  if (res.status === 401) { window.location.href = '/login'; return; }
  const rows = await res.json();
  const list = document.getElementById('alertsList');
  if (rows.length === 0) {
    list.innerHTML = '<li class="no-data">No alerts yet</li>';
    return;
  }
  list.innerHTML = rows.map(a => `<li><strong>${a.node_id}</strong> — ${a.message} <em>(${a.timestamp})</em></li>`).join('');
}

function refreshAll() {
  refreshLatest();
  refreshHistory();
  refreshAlerts();
}

loadThresholds();
refreshAll();
setInterval(refreshAll, 5000); // auto-refresh every 5 seconds
</script>

</body>
</html>
